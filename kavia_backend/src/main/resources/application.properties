spring.application.name=kaviabackend

# PostgreSQL Database Configuration
# Values are provided via environment variables configured by the orchestrator.
# POSTGRES_URL should include the host and port (e.g. the kavia_database port 5001).
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use "update" so the schema for sessions, icons, windows, and taskbar items is created/updated automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# HTTP Server Configuration
# Run the backend on port 3001 so the React frontend can call http://localhost:3001.
server.port=3001

# CORS Configuration
# Comma-separated list of allowed origins; can be overridden via environment/properties.
# Includes local development (http://localhost:3000) and the preview frontend origin.
kavia.cors.allowed-origins=http://localhost:3000,https://vscode-internal-27297-beta.beta01.cloud.kavia.ai:3000
